# Saudi ministries: PARALLEL crawl (one job per zero-PDF authority) so the list
# cannot get stuck for 24h on a single site. Merge + deploy at the end.
name: Crawl gazette PDFs

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "saudi_ministries (parallel zeros) or all_gazette"
        required: false
        default: "saudi_ministries"
      max_pages:
        description: "BFS pages per source URL"
        required: false
        default: "35"
      time_budget_minutes:
        description: "Per-ministry job time budget (minutes)"
        required: false
        default: "18"
      max_pdfs_per_source:
        description: "Max NEW regulatory PDFs per source URL"
        required: false
        default: "20"
      delay:
        description: "Seconds between requests"
        required: false
        default: "0.2"
      include_legal_db:
        description: "all_gazette only"
        required: false
        default: "false"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: crawl-pdfs
  cancel-in-progress: true

jobs:
  # ---------- Parallel: one runner per ministry still at 0 PDFs ----------
  crawl-ministry:
    if: ${{ github.event_name == 'schedule' || github.event.inputs.mode != 'all_gazette' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        # 15 authorities currently showing 0 PDFs on Ministries tab
        code:
          - SOCPA
          - TGA
          - MOI
          - Nazaha
          - SAMA
          - MOJ
          - GAC
          - CST
          - CMA
          - Tadawul
          - SDAIA
          - GOSI
          - SASO
          - SAIP
          - ZATCA
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps || echo "playwright skip"

      - name: Filter links for this ministry
        run: |
          set -euo pipefail
          CODE="${{ matrix.code }}"
          mkdir -p data/pdfs _out
          # Keep only lines for this authority code
          grep -E "^Saudi Arabia - ${CODE} \|" data/saudi_ministries_links.txt > "data/_one_${CODE}.txt" || true
          # SDAIA: append dedicated seed file (36+ public PDPL/NDMO docs expected)
          if [ "$CODE" = "SDAIA" ] && [ -f data/sdaia_seed_pdfs.txt ]; then
            grep -E "^Saudi Arabia - SDAIA \|" data/sdaia_seed_pdfs.txt >> "data/_one_${CODE}.txt" || true
          fi
          if [ ! -s "data/_one_${CODE}.txt" ]; then
            echo "No links for $CODE — writing homepage fallback"
            # fallback map
            case "$CODE" in
              SOCPA) U="https://socpa.org.sa" ;;
              TGA) U="https://tga.gov.sa" ;;
              MOI) U="https://www.moi.gov.sa" ;;
              Nazaha) U="https://nazaha.gov.sa" ;;
              SAMA) U="https://rulebook.sama.gov.sa/en" ;;
              MOJ) U="https://www.moj.gov.sa" ;;
              GAC) U="https://gac.gov.sa" ;;
              CST) U="https://www.cst.gov.sa" ;;
              CMA) U="https://cma.org.sa/en/RulesRegulations/Regulations/Documents/" ;;
              Tadawul) U="https://www.saudiexchange.sa" ;;
              SDAIA) U="https://sdaia.gov.sa/en/SDAIA/about/Documents/" ;;
              GOSI) U="https://www.gosi.gov.sa" ;;
              SASO) U="https://www.saso.gov.sa" ;;
              SAIP) U="https://www.saip.gov.sa" ;;
              ZATCA) U="https://zatca.gov.sa/en/RulesRegulations/Pages/rules.aspx" ;;
              *) U="https://www.google.com" ;;
            esac
            echo "Saudi Arabia - ${CODE} | ministry | ${U}" > "data/_one_${CODE}.txt"
          fi
          # dedupe URLs
          sort -u "data/_one_${CODE}.txt" -o "data/_one_${CODE}.txt"
          echo "=== Links for ${CODE} ($(wc -l < data/_one_${CODE}.txt) lines) ==="
          cat "data/_one_${CODE}.txt"

      - name: Crawl this ministry only
        env:
          CODE: ${{ matrix.code }}
        run: |
          set -euo pipefail
          MAX_PAGES="${{ github.event.inputs.max_pages }}"
          MAX_PAGES="${MAX_PAGES:-35}"
          BUDGET="${{ github.event.inputs.time_budget_minutes }}"
          BUDGET="${BUDGET:-18}"
          MAX_PDFS="${{ github.event.inputs.max_pdfs_per_source }}"
          MAX_PDFS="${MAX_PDFS:-20}"
          DELAY="${{ github.event.inputs.delay }}"
          DELAY="${DELAY:-0.2}"
          # SDAIA has a large public doc set — raise caps for this job only
          if [ "$CODE" = "SDAIA" ]; then
            MAX_PAGES=80
            MAX_PDFS=50
            BUDGET=35
            PER_SRC=10
          else
            PER_SRC=6
          fi

          # Empty manifest so this job only collects THIS ministry's new PDFs
          echo '{"downloads":[],"errors":[],"source_reports":[],"stats":{}}' > data/pdfs/manifest.json

          python -u collector/download_gazette_pdfs.py \
            --url-only \
            --from-file "data/_one_${CODE}.txt" \
            --regulatory-only \
            --max-pages "$MAX_PAGES" \
            --max-pdfs-per-source "$MAX_PDFS" \
            --max-minutes-per-source "$PER_SRC" \
            --time-budget-minutes "$BUDGET" \
            --skip-if-pdfs 0 \
            --live-publish-every 0 \
            --no-git-push \
            --delay "$DELAY"

          # Export only this ministry's downloads as artifact
          python - <<PY
          import json
          from pathlib import Path
          code = "${CODE}"
          m = json.loads(Path("data/pdfs/manifest.json").read_text())
          dls = [d for d in (m.get("downloads") or []) if not d.get("dry_run")]
          # keep only matching jurisdiction
          keep = [d for d in dls if code in str(d.get("jurisdiction") or "")]
          Path("_out").mkdir(exist_ok=True)
          out = {"code": code, "downloads": keep, "count": len(keep)}
          Path(f"_out/{code}.json").write_text(json.dumps(out, ensure_ascii=False, indent=2))
          print(f"{code}: {len(keep)} PDFs")
          for d in keep[:8]:
              print(" ", (d.get("title") or d.get("url") or "")[:100])
          PY

      - name: Upload ministry artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ministry-${{ matrix.code }}
          path: _out/${{ matrix.code }}.json
          if-no-files-found: warn
          retention-days: 7

  # ---------- Merge all ministry artifacts + push + deploy ----------
  merge-deploy:
    needs: [crawl-ministry]
    if: always() && (github.event_name == 'schedule' || github.event.inputs.mode != 'all_gazette')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Download all ministry artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: _ministry_out
          pattern: ministry-*
          merge-multiple: true

      - name: Merge + rebuild catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -la _ministry_out || true
          find _ministry_out -type f -name '*.json' | head -40 || true
          python scripts/merge_ministry_artifacts.py _ministry_out
          # Fix mislabeled hosts (e.g. sdaia PDFs stored as NCA/MoC)
          python scripts/fix_ministry_jurisdiction_labels.py || true
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          c = json.loads(Path("web/data/pdfs_catalog.json").read_text())
          sa = [x for x in c if str(x.get("jurisdiction","")).startswith("Saudi")]
          print("total", len(c), "SA", len(sa))
          print(Counter(x.get("jurisdiction") for x in sa).most_common(30))
          zeros = []
          expected = ["MOMAH","SOCPA","TGA","MoC","MOI","Nazaha","SAMA","MOJ","GAC","CST","MOF","CMA","Tadawul","NCA","SDAIA","GOSI","MEWA","SASO","IA","SAIP","ZATCA"]
          counts = Counter(x.get("jurisdiction") for x in sa)
          for code in expected:
              j = f"Saudi Arabia - {code}"
              n = counts.get(j, 0)
              print(f"  {n:4d}  {j}")
              if n == 0:
                  zeros.append(code)
          print("still_zero", zeros)
          Path("ministry_coverage.txt").write_text(
              "zeros=" + ",".join(zeros) + f"\nsa_total={len(sa)}\n"
          )
          PY

      - name: Commit catalog to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/pdfs/manifest.json web/data/pdfs_catalog.json \
            web/data/crawl_status.json android/app/src/main/assets/pdfs_catalog.json \
            data/saudi_ministries_links.txt web/data/saudi_ministries_links.txt 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No catalog changes"
          else
            REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git commit -m "chore: parallel Saudi ministry crawl merge $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for i in 1 2 3 4 5; do
              git fetch "$REPO" main:refs/remotes/origin/main || true
              git rebase origin/main || true
              git push "$REPO" HEAD:main && break
              sleep $((i * 3))
            done
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        if: always()
        run: |
          echo "### Parallel Saudi ministry crawl" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat ministry_coverage.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Site: https://tmai-tech.github.io/regintel/" >> "$GITHUB_STEP_SUMMARY"

  # ---------- Optional: global gazette (explicit mode only) ----------
  crawl-gazette:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'all_gazette' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps || true
      - name: Gazette crawl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGINTEL_LIVE_GIT_PUSH: "1"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MAX_PAGES="${{ github.event.inputs.max_pages }}"
          BUDGET="${{ github.event.inputs.time_budget_minutes }}"
          python -u collector/download_gazette_pdfs.py \
            --max-pages "${MAX_PAGES:-200}" \
            --time-budget-minutes "${BUDGET:-280}" \
            --live-publish-every 5 \
            --git-push \
            --delay 0.35
