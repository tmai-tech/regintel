# Long-running, resume-safe PDF crawl on GitHub Actions.
# GHA jobs max ~6h → we run in chunks with --time-budget-minutes and resume via manifest.
#
# Live site updates:
# - crawler commits catalog/status to main (resume + history)
# - this workflow ALSO deploys GitHub Pages directly (GITHUB_TOKEN pushes do NOT
#   trigger deploy-pages.yml — that is why the public site stayed stale at ~546)
name: Crawl gazette PDFs

on:
  schedule:
    # Keep crawling until the sheet is exhausted (resume-safe).
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Crawl mode: saudi_ministries (your morning 21 links) or all_gazette (global sheet)"
        required: false
        default: "saudi_ministries"
      max_pages:
        description: "BFS pages per source URL (keep low for ministry legal focus)"
        required: false
        default: "80"
      time_budget_minutes:
        description: "Stop after N minutes (leave headroom under 6h job limit)"
        required: false
        default: "280"
      max_pdfs_per_source:
        description: "Max NEW regulatory PDFs per ministry (0=unlimited)"
        required: false
        default: "40"
      delay:
        description: "Seconds between requests"
        required: false
        default: "0.25"
      include_legal_db:
        description: "Also crawl legal_databases column (true/false)"
        required: false
        default: "false"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: crawl-pdfs
  # New saudi-focused runs replace stuck multi-hour BFS jobs
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # JS fallback for SPA gazette sites (optional if install fails)
          playwright install chromium --with-deps || echo "playwright browser install skipped"

      - name: Ensure dirs
        run: |
          mkdir -p data/pdfs web/data android/app/src/main/assets
          # empty manifest if missing so crawl can start
          if [ ! -f data/pdfs/manifest.json ]; then
            echo '{"downloads":[],"errors":[],"source_reports":[],"stats":{}}' > data/pdfs/manifest.json
          fi

      - name: Prune non-regulatory ministry junk PDFs
        if: always()
        run: |
          set -euo pipefail
          python scripts/prune_ministry_junk_pdfs.py || true
          # Commit pruned catalog so site stops showing IoT/workshop waste
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/pdfs/manifest.json web/data/pdfs_catalog.json \
            android/app/src/main/assets/pdfs_catalog.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git commit -m "chore: prune non-regulatory ministry PDFs"
            git push "$REPO" HEAD:main || true
          else
            echo "No junk to prune"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Crawl (resume-safe, live publish)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGINTEL_LIVE_GIT_PUSH: "1"
        run: |
          set -euo pipefail
          MAX_PAGES="${{ github.event.inputs.max_pages }}"
          BUDGET="${{ github.event.inputs.time_budget_minutes }}"
          MAX_PDFS="${{ github.event.inputs.max_pdfs_per_source }}"
          DELAY="${{ github.event.inputs.delay }}"
          LEGAL="${{ github.event.inputs.include_legal_db }}"
          LEGAL="${LEGAL:-false}"
          MODE="${{ github.event.inputs.mode }}"
          # Default + schedule: only the morning Saudi ministries list (21 authorities).
          # Use mode=all_gazette only when you explicitly want the global sheet again.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MODE="saudi_ministries"
          fi
          MODE="${MODE:-saudi_ministries}"

          # Saudi ministry defaults: shallow legal-focused crawl, not 300-page junk BFS
          if [ "$MODE" = "saudi_ministries" ]; then
            MAX_PAGES="${MAX_PAGES:-80}"
            MAX_PDFS="${MAX_PDFS:-40}"
            DELAY="${DELAY:-0.25}"
          else
            MAX_PAGES="${MAX_PAGES:-200}"
            MAX_PDFS="${MAX_PDFS:-0}"
            DELAY="${DELAY:-0.35}"
          fi
          BUDGET="${BUDGET:-280}"

          # git identity for live_publish pushes during the run
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          EXTRA=()
          if [ "$MODE" = "saudi_ministries" ]; then
            echo "=== Priority crawl: Saudi ministries (regulatory PDFs only) ==="
            test -f data/saudi_ministries_links.txt
            echo "--- data/saudi_ministries_links.txt ---"
            cat data/saudi_ministries_links.txt
            echo "--------------------------------------"
            echo "max_pages=$MAX_PAGES max_pdfs=$MAX_PDFS delay=$DELAY (regulatory filter ON)"
            EXTRA+=(--url-only --from-file data/saudi_ministries_links.txt --regulatory-only)
          else
            echo "=== Global gazette sheet crawl (mode=$MODE) ==="
            if [ "$LEGAL" = "true" ]; then
              EXTRA+=(--include-legal-db)
            fi
          fi

          python -u collector/download_gazette_pdfs.py \
            --max-pages "$MAX_PAGES" \
            --max-pdfs-per-source "$MAX_PDFS" \
            --time-budget-minutes "$BUDGET" \
            --live-publish-every 5 \
            --git-push \
            --delay "$DELAY" \
            "${EXTRA[@]+"${EXTRA[@]}"}"

      - name: Final catalog + status publish
        if: always()
        env:
          REGINTEL_LIVE_GIT_PUSH: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Rebuild catalog from runner manifest (even if mid-run pushes failed)
          python collector/live_publish.py || true
          git add -f data/pdfs/manifest.json data/pdfs/crawl_status.json \
            web/data/pdfs_catalog.json web/data/crawl_status.json \
            android/app/src/main/assets/pdfs_catalog.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No final data changes to commit"
          else
            # Authenticated push (fixes silent exit 1 seen on 173 mid-run pushes)
            REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git fetch "$REPO" main:refs/remotes/origin/main || true
            git rebase origin/main || true
            git commit -m "chore: crawl chunk complete $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
            for i in 1 2 3 4 5; do
              if git push "$REPO" HEAD:main; then
                echo "Pushed catalog to main (attempt $i)"
                break
              fi
              echo "Push failed attempt $i — rebase and retry"
              git fetch "$REPO" main:refs/remotes/origin/main || true
              git rebase origin/main || true
              sleep $((i * 3))
            done
          fi
          # Always upload artifacts so we never lose a successful crawl again
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("data/pdfs/manifest.json").read_text()) if Path("data/pdfs/manifest.json").exists() else {}
          n = len([d for d in (m.get("downloads") or []) if not d.get("dry_run")])
          saudi = sum(1 for d in (m.get("downloads") or []) if "saudi" in str(d.get("jurisdiction") or "").lower() or d.get("source_kind") == "ministry")
          print(f"manifest_downloads={n} saudi_or_ministry={saudi}")
          Path("crawl_metrics.txt").write_text(f"pdfs={n}\nsaudi={saudi}\n")
          PY

      - name: Upload crawl artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-catalog
          path: |
            data/pdfs/manifest.json
            data/pdfs/crawl_status.json
            web/data/pdfs_catalog.json
            web/data/crawl_status.json
            crawl_metrics.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          python <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path("data/pdfs/manifest.json").read_text()) if Path("data/pdfs/manifest.json").exists() else {}
          downloads = [d for d in (m.get("downloads") or []) if not d.get("dry_run")]
          n = len(downloads)
          saudi = sum(1 for d in downloads if "saudi" in str(d.get("jurisdiction") or "").lower() or d.get("source_kind") == "ministry")
          s = {}
          if Path("web/data/crawl_status.json").exists():
              s = json.loads(Path("web/data/crawl_status.json").read_text())
          lines = [
              "### Crawl chunk summary",
              "",
              f"- **PDFs in catalog (manifest)**: {n}",
              f"- **Saudi / ministry-labeled**: {saudi}",
              f"- **Phase**: {s.get('phase')}",
              f"- **Message**: {s.get('message')}",
              "- **Site**: https://tmai-tech.github.io/regintel/",
              "- Open the **Ministries** / **Crawl** tabs after deploy",
              "",
          ]
          text = "\n".join(lines) + "\n"
          print(text)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as f:
                  f.write(text)
          PY

  # Deploy Pages from the crawl job workspace (not a fresh main checkout), so
  # Saudi PDFs appear even if git push failed mid-run.
  deploy-site:
    needs: crawl
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Download crawl artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: crawl-catalog
          path: _crawl_out

      - name: Merge crawl outputs into web/
        run: |
          set -euo pipefail
          mkdir -p web/data data/pdfs
          cp -f data/*.json web/data/ 2>/dev/null || true
          # Prefer artifact from this crawl run (has Saudi PDFs even if push failed)
          if [ -f _crawl_out/web/data/pdfs_catalog.json ]; then
            cp -f _crawl_out/web/data/pdfs_catalog.json web/data/pdfs_catalog.json
            echo "Using catalog from crawl artifact"
          fi
          if [ -f _crawl_out/web/data/crawl_status.json ]; then
            cp -f _crawl_out/web/data/crawl_status.json web/data/crawl_status.json
          elif [ -f _crawl_out/data/pdfs/crawl_status.json ]; then
            cp -f _crawl_out/data/pdfs/crawl_status.json web/data/crawl_status.json
          fi
          if [ -f _crawl_out/data/pdfs/manifest.json ]; then
            cp -f _crawl_out/data/pdfs/manifest.json data/pdfs/manifest.json
          fi
          for f in web/index.html web/manifest.webmanifest web/assets/app.js web/assets/styles.css; do
            test -f "$f" || { echo "::error::Missing $f"; exit 1; }
          done
          echo "pdfs_catalog.json: $(wc -c < web/data/pdfs_catalog.json 2>/dev/null || echo 0) bytes"
          python3 -c "import json; c=json.load(open('web/data/pdfs_catalog.json')); sa=sum(1 for x in c if 'saudi' in str(x.get('jurisdiction') or '').lower() or x.get('source_kind')=='ministry'); print('catalog', len(c), 'saudi/ministry', sa)" || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
