# Finish remaining Saudi sites: cut-off crawls + zeros + thin catalogs.
# Skips SDAIA / MEWA / MC / NCA / CMA (already published in volume).
name: Crawl Saudi remaining

on:
  workflow_dispatch:
    inputs:
      delay:
        description: "Seconds between requests"
        required: false
        default: "0.25"

permissions:
  contents: write

jobs:
  crawl:
    name: ${{ matrix.code }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - code: MOMAH
            url: https://momah.gov.sa
            label: Saudi Arabia - MOMAH
            max_pages: "3000"
            seed: data/momah_found_docs.txt
          - code: ZATCA
            url: https://zatca.gov.sa
            label: Saudi Arabia - ZATCA
            max_pages: "3000"
            seed: data/zatca_found_docs.txt
          - code: SAIP
            url: https://www.saip.gov.sa
            label: Saudi Arabia - SAIP
            max_pages: "3000"
            seed: ""
          - code: TGA
            url: https://tga.gov.sa
            label: Saudi Arabia - TGA
            max_pages: "2000"
            seed: ""
          - code: MOF
            url: https://www.mof.gov.sa
            label: Saudi Arabia - MOF
            max_pages: "2000"
            seed: ""
          - code: IA
            url: https://ia.gov.sa
            label: Saudi Arabia - IA
            max_pages: "2000"
            seed: ""
          - code: SOCPA
            url: https://socpa.org.sa
            label: Saudi Arabia - SOCPA
            max_pages: "2000"
            seed: ""
          - code: MOI
            url: https://www.moi.gov.sa
            label: Saudi Arabia - MOI
            max_pages: "2000"
            seed: ""
          - code: NAZAHA
            url: https://nazaha.gov.sa
            label: Saudi Arabia - Nazaha
            max_pages: "2000"
            seed: ""
          - code: SAMA
            url: https://rulebook.sama.gov.sa/en
            label: Saudi Arabia - SAMA
            max_pages: "2000"
            seed: ""
          - code: MOJ
            url: https://www.moj.gov.sa
            label: Saudi Arabia - MOJ
            max_pages: "2000"
            seed: ""
          - code: GAC
            url: https://gac.gov.sa
            label: Saudi Arabia - GAC
            max_pages: "2000"
            seed: ""
          - code: CST
            url: https://www.cst.gov.sa
            label: Saudi Arabia - CST
            max_pages: "2000"
            seed: ""
          - code: TADAWUL
            url: https://www.saudiexchange.sa
            label: Saudi Arabia - Tadawul
            max_pages: "2000"
            seed: ""
          - code: GOSI
            url: https://www.gosi.gov.sa
            label: Saudi Arabia - GOSI
            max_pages: "2000"
            seed: ""
          - code: SASO
            url: https://www.saso.gov.sa
            label: Saudi Arabia - SASO
            max_pages: "2000"
            seed: ""
    concurrency:
      group: crawl-finish-${{ matrix.code }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pymupdf || true
          python -m playwright install --with-deps chromium || python -m playwright install chromium || true

      - name: Crawl ${{ matrix.code }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGINTEL_LIVE_GIT_PUSH: "1"
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s\n' "${FIREBASE_SERVICE_ACCOUNT}" > "${RUNNER_TEMP}/firebase-sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="${RUNNER_TEMP}/firebase-sa.json"
          fi
          SEED_ARGS=()
          if [ -n "${{ matrix.seed }}" ] && [ -f "${{ matrix.seed }}" ]; then
            SEED_ARGS+=(--seed-list "${{ matrix.seed }}")
            echo "Using seed ${{ matrix.seed }}"
          fi
          set +e
          timeout --signal=TERM --kill-after=45s 160m python -u collector/ministry_pipeline.py \
            --url "${{ matrix.url }}" \
            --label "${{ matrix.label }}" \
            --max-pages "${{ matrix.max_pages }}" \
            --delay "${{ github.event.inputs.delay || 0.25 }}" \
            --insecure \
            "${SEED_ARGS[@]+"${SEED_ARGS[@]}"}"
          rc=$?
          set -euo pipefail
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "::warning::timed out ${{ matrix.code }}"
          elif [ "$rc" -ne 0 ]; then
            echo "::warning::failed ${{ matrix.code }} rc=$rc"
          fi
          python scripts/fix_ministry_jurisdiction_labels.py || true
          python scripts/publish_saudi_ministries.py || true

      - name: Commit + push catalog
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python collector/live_publish.py || true
          python scripts/publish_saudi_ministries.py || true
          git add -f data/pdfs/manifest.json data/pdfs/ministry_lists \
            web/data/pdfs_catalog.json web/data/crawl_status.json \
            web/data/active_crawls.json web/data/crawls \
            web/data/ministry_document_list.json \
            web/data/saudi_ministries.json web/data/laws_catalog.json \
            web/data/meta.json \
            android/app/src/main/assets/pdfs_catalog.json \
            data/pdfs/crawl_status.json data/saudi_ministries.json 2>/dev/null || true
          REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git diff --staged --quiet; then
            git commit -m "chore: ${{ matrix.code }} remaining crawl $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
            for i in 1 2 3 4 5 6 7 8; do
              git fetch "$REPO" main:refs/remotes/origin/main || true
              git rebase origin/main || git rebase --abort || true
              git push "$REPO" HEAD:main && break
              sleep $((i * 4))
            done
          fi

  summarize:
    needs: crawl
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Eva summaries for new PDFs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -u collector/eva_summarize.py --jurisdiction "Saudi" --limit 80 --delay 0.3 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/eva/summaries.jsonl web/data/eva_summaries.json web/data/eva_meta.json || true
          REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git diff --staged --quiet; then
            git commit -m "chore: Eva summaries after remaining crawl $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
            git pull --rebase origin main || true
            git push "$REPO" HEAD:main || true
          fi
