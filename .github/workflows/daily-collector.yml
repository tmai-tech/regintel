name: Daily collector

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max sources to fetch"
        required: false
        default: "50"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Seed from Excel (if present)
        run: |
          if [ -f "BCI Tracking Plan.xlsx" ]; then
            .venv/bin/python scripts/seed_from_excel.py
          fi

      - name: Run collector
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          LIMIT="${LIMIT:-50}"
          .venv/bin/python collector/run_daily.py --limit "$LIMIT" --force

      - name: Commit data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data web/data || true
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: daily collector update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
