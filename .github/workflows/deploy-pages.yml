name: Deploy UI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Do not cancel — live crawl progress commits every ~90s and would
  # otherwise abort every in-flight Pages deploy (site stays stale).
  group: pages
  cancel-in-progress: false


jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync data into web/ (SDAIA-only public site)
        run: |
          set -euo pipefail
          mkdir -p web/data
          # Do NOT copy root data/*.json over web/data — that reintroduces the
          # global multi-jurisdiction catalog (12k+ PDFs, laws, gazette, etc.).
          # Public site is SDAIA-only: strip anything non-SDAIA before upload.
          if [ -f scripts/publish_sdaia_only.py ]; then
            python3 scripts/publish_sdaia_only.py
          fi
          if [ ! -f web/data/pdfs_catalog.json ]; then
            echo "::warning::web/data/pdfs_catalog.json missing — UI will show load error until catalog is generated."
          else
            echo "pdfs_catalog.json: $(wc -c < web/data/pdfs_catalog.json) bytes · $(python3 -c "import json;print(len(json.load(open('web/data/pdfs_catalog.json'))))") PDFs"
          fi
          if [ ! -f web/data/laws_catalog.json ]; then
            echo "[]" > web/data/laws_catalog.json
          fi
          # Sanity: required static files for iOS web client
          for f in web/index.html web/manifest.webmanifest web/assets/app.js web/assets/styles.css; do
            test -f "$f" || { echo "::error::Missing $f"; exit 1; }
          done
          ls -la web web/assets web/data | head -80

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Print share URL
        run: |
          echo "### iOS / web share URL" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**https://tmai-tech.github.io/regintel/**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed page_url: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
# deploy-kick
