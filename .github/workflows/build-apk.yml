name: Build APK

on:
  push:
    branches:
      - main
      - master
      - dev
      - 'feat/**'
      - 'fix/**'
      - 'ci/**'
    # Only rebuild APK when app/code changes — not on crawl data / Pages noise
    # (data/** pushes were queueing APK jobs and starving Pages deploys).
    paths:
      - 'android/**'
      - 'collector/**'
      - 'requirements.txt'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'collector/**'
      - 'requirements.txt'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      tester_groups:
        description: 'Firebase tester groups (comma-separated, optional)'
        required: false
        default: ''
        type: string
      release_notes:
        description: 'Optional release notes for testers'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: apk-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::notice::No ANDROID_KEYSTORE_BASE64 — using default debug keystore."
            exit 0
          fi
          mkdir -p android
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/ci-upload.keystore
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS:-regintel}
          storeFile=ci-upload.keystore
          EOF
          sed -i 's/^[[:space:]]*//' android/key.properties
          echo "Wrote android/key.properties + ci-upload.keystore"

      - name: Build debug APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs -name "*.apk" -type f | head -n 1)
          if [ -z "${APK:-}" ]; then
            echo "::error::No APK found"
            find android -type f -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK ($(du -h "$APK" | cut -f1))"

      - name: Rename APK for artifact
        id: named
        run: |
          set -euo pipefail
          SRC="${{ steps.apk.outputs.path }}"
          OUT_DIR="android/app/build/outputs/apk/debug"
          mkdir -p "$OUT_DIR"
          OUT="${OUT_DIR}/regintel-debug-${GITHUB_SHA::7}.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename "$OUT")" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: regintel-debug-${{ github.sha }}
          path: ${{ steps.named.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Firebase App Distribution
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TESTER_GROUPS: ${{ secrets.FIREBASE_TESTER_GROUPS }}
          INPUT_GROUPS: ${{ github.event.inputs.tester_groups }}
          INPUT_NOTES: ${{ github.event.inputs.release_notes }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          APK_PATH: ${{ steps.named.outputs.path }}
        run: |
          set -u
          echo "Firebase distribute step starting…"

          if [ -z "${FIREBASE_ANDROID_APP_ID:-}" ] || [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "::notice::Firebase App Distribution skipped — set secrets FIREBASE_ANDROID_APP_ID and FIREBASE_SERVICE_ACCOUNT."
            echo "See docs/FIREBASE_APP_DISTRIBUTION.md"
            exit 0
          fi

          FAD_GROUPS="${INPUT_GROUPS:-}"
          if [ -z "${FAD_GROUPS}" ]; then
            FAD_GROUPS="${FIREBASE_TESTER_GROUPS:-}"
          fi
          if [ -z "${FAD_GROUPS}" ]; then
            FAD_GROUPS="testers"
          fi
          FAD_GROUPS=$(echo "${FAD_GROUPS}" | tr -d '[:space:]')
          case "${FAD_GROUPS}" in
            ""|1001)
              echo "::warning::Invalid/empty tester group; using alias testers"
              FAD_GROUPS="testers"
              ;;
            *[!0-9]*)
              ;;
            *)
              echo "::warning::FIREBASE_TESTER_GROUPS looks numeric; using alias testers"
              FAD_GROUPS="testers"
              ;;
          esac
          echo "Resolved tester group alias: ${FAD_GROUPS}"

          if [ -n "${INPUT_NOTES:-}" ]; then
            NOTES="${INPUT_NOTES}"
          else
            MSG="${COMMIT_MSG:-Manual / workflow_dispatch build}"
            NOTES=$(printf 'RegIntel %s @ %s\n\n%s\n\nRun: %s/%s/actions/runs/%s' \
              "${GITHUB_REF_NAME}" "${GITHUB_SHA::7}" "${MSG}" \
              "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")
          fi

          SA_FILE="${RUNNER_TEMP}/firebase-sa.json"
          printf '%s\n' "${FIREBASE_SERVICE_ACCOUNT}" > "${SA_FILE}"
          export GOOGLE_APPLICATION_CREDENTIALS="${SA_FILE}"

          npm install -g firebase-tools

          echo "Uploading ${APK_PATH} to Firebase App Distribution (groups: ${FAD_GROUPS})"

          set +e
          firebase appdistribution:distribute "${APK_PATH}" \
            --app "${FIREBASE_ANDROID_APP_ID}" \
            --groups "${FAD_GROUPS}" \
            --release-notes "${NOTES}"
          RC=$?

          rm -f "${SA_FILE}"

          if [ "$RC" -ne 0 ]; then
            echo "::warning::firebase appdistribution:distribute exited with $RC"
            echo "APK artifact is still available on this run. Check Firebase console / group '${FAD_GROUPS}'."
            exit 0
          fi

          echo "Firebase App Distribution upload complete."
