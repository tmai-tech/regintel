# Parallel deep crawls for remaining sites on data/saudi_ministries_links.txt
# Skips SDAIA / MEWA / MC (already extracted) and TGA (no public PDFs).
name: Crawl Saudi sheet

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Max HTML pages per site"
        required: false
        default: "2000"
      delay:
        description: "Seconds between requests"
        required: false
        default: "0.25"

permissions:
  contents: write

jobs:
  crawl:
    name: ${{ matrix.code }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - code: MOMAH
            url: https://momah.gov.sa
            label: Saudi Arabia - MOMAH
          - code: MOF
            url: https://www.mof.gov.sa
            label: Saudi Arabia - MOF
          - code: NCA
            url: https://nca.gov.sa
            label: Saudi Arabia - NCA
          - code: IA
            url: https://ia.gov.sa
            label: Saudi Arabia - IA
          - code: SOCPA
            url: https://socpa.org.sa
            label: Saudi Arabia - SOCPA
          - code: MOI
            url: https://www.moi.gov.sa
            label: Saudi Arabia - MOI
          - code: NAZAHA
            url: https://nazaha.gov.sa
            label: Saudi Arabia - Nazaha
          - code: SAMA
            url: https://rulebook.sama.gov.sa/en
            label: Saudi Arabia - SAMA
          - code: MOJ
            url: https://www.moj.gov.sa
            label: Saudi Arabia - MOJ
          - code: GAC
            url: https://gac.gov.sa
            label: Saudi Arabia - GAC
          - code: CST
            url: https://www.cst.gov.sa
            label: Saudi Arabia - CST
          - code: CMA
            url: https://cma.org.sa
            label: Saudi Arabia - CMA
          - code: TADAWUL
            url: https://www.saudiexchange.sa
            label: Saudi Arabia - Tadawul
          - code: GOSI
            url: https://www.gosi.gov.sa
            label: Saudi Arabia - GOSI
          - code: SASO
            url: https://www.saso.gov.sa
            label: Saudi Arabia - SASO
          - code: SAIP
            url: https://www.saip.gov.sa
            label: Saudi Arabia - SAIP
          - code: ZATCA
            url: https://zatca.gov.sa
            label: Saudi Arabia - ZATCA
    concurrency:
      group: crawl-sheet-${{ matrix.code }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pymupdf || true
          python -m playwright install --with-deps chromium || python -m playwright install chromium || true

      - name: Crawl ${{ matrix.code }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGINTEL_LIVE_GIT_PUSH: "1"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          timeout --signal=TERM --kill-after=45s 100m python -u collector/ministry_pipeline.py \
            --url "${{ matrix.url }}" \
            --label "${{ matrix.label }}" \
            --max-pages "${{ github.event.inputs.max_pages || 2000 }}" \
            --delay "${{ github.event.inputs.delay || 0.25 }}" \
            --insecure
          rc=$?
          set -euo pipefail
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "::warning::timed out ${{ matrix.code }}"
          elif [ "$rc" -ne 0 ]; then
            echo "::warning::failed ${{ matrix.code }} rc=$rc"
          fi
          python scripts/fix_ministry_jurisdiction_labels.py || true
          python scripts/publish_saudi_ministries.py || true

      - name: Commit + push catalog
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python collector/live_publish.py || true
          python scripts/publish_saudi_ministries.py || true
          git add -f data/pdfs/manifest.json data/pdfs/ministry_lists \
            web/data/pdfs_catalog.json web/data/crawl_status.json \
            web/data/ministry_document_list.json \
            web/data/saudi_ministries.json web/data/laws_catalog.json \
            web/data/meta.json web/data/eva_summaries.json web/data/eva_meta.json \
            android/app/src/main/assets/pdfs_catalog.json \
            data/pdfs/crawl_status.json data/saudi_ministries.json 2>/dev/null || true
          REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git diff --staged --quiet; then
            git commit -m "chore: ${{ matrix.code }} sheet crawl $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
            for i in 1 2 3 4 5 6 7 8; do
              git fetch "$REPO" main:refs/remotes/origin/main || true
              git rebase origin/main || git rebase --abort || true
              git push "$REPO" HEAD:main && break
              sleep $((i * 4))
            done
          fi

  summarize:
    needs: crawl
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Eva summaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pymupdf || true
          python -u collector/eva_summarize.py --limit 200 || true
          python scripts/publish_saudi_ministries.py || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f web/data/eva_summaries.json web/data/eva_meta.json web/data/pdfs_catalog.json || true
          REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git diff --staged --quiet; then
            git commit -m "chore: Eva summaries after Saudi sheet crawl" || true
            git fetch "$REPO" main:refs/remotes/origin/main || true
            git rebase origin/main || true
            git push "$REPO" HEAD:main || true
          fi
