<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="RegIntel — enter a ministry site, crawl its PDFs, read summaries." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RegIntel" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icon-180.png" />
  <title>RegIntel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css?v=home3" />
</head>
<body>
  <div class="app">
    <header class="home-head">
      <div class="brand">
        <div class="logo" aria-hidden="true">⚖️</div>
        <div>
          <h1>RegIntel</h1>
          <p class="subtitle">Deep-crawl a site. Open a card for PDFs, summaries, and translate.</p>
        </div>
      </div>
    </header>

    <form class="crawl-bar" id="crawlForm">
      <label class="sr-only" for="crawlUrl">Site URL to crawl</label>
      <input
        type="text"
        id="crawlUrl"
        name="url"
        inputmode="url"
        autocomplete="url"
        placeholder="https://sdaia.gov.sa"
        required
        spellcheck="false"
        autocapitalize="off"
      />
      <button type="submit" class="btn primary" id="crawlStart">Start crawl</button>
    </form>
    <p class="crawl-status muted" id="crawlStatus" role="status"></p>

    <section id="viewHome">
      <h2 class="section-title">Extracted sites</h2>
      <div id="siteList" class="site-grid" role="list"></div>
      <div id="siteEmpty" class="empty" hidden>No sites yet. Enter a URL above and start a crawl.</div>

      <div class="section-row" id="progressHead" hidden>
        <h2 class="section-title" id="progressTitle">Crawl in progress</h2>
        <button type="button" class="btn ghost" id="progressRefresh">Refresh status</button>
      </div>
      <div id="progressList" class="site-grid" role="list"></div>
    </section>

    <section id="viewDetail" hidden>
      <div class="detail-head">
        <button type="button" class="btn ghost" id="detailBack">← Sites</button>
        <div class="detail-title">
          <h2 id="detailName">Site</h2>
          <p class="muted" id="detailMeta"></p>
        </div>
      </div>
      <div class="toolbar sticky-toolbar">
        <label class="sr-only" for="summarySearch">Search PDFs</label>
        <input type="search" id="summarySearch" enterkeyhint="search" autocomplete="off" placeholder="Search title or summary…" />
        <label class="sr-only" for="summaryFilter">Filter by summary status</label>
        <select id="summaryFilter" aria-label="Summary status">
          <option value="all">All PDFs</option>
          <option value="with" selected>With summary</option>
          <option value="pending">Summary pending</option>
        </select>
        <span id="summaryCount" class="muted row-count" aria-live="polite"></span>
      </div>
      <div id="summaryList" class="pdf-list" role="list"></div>
      <div id="summaryMoreWrap" class="summary-more" hidden>
        <button type="button" class="btn ghost" id="summaryMore">Load more</button>
      </div>
      <div id="summaryEmpty" class="empty" hidden>No PDFs for this site yet.</div>
    </section>

    <div class="pdf-xlate-modal" id="pdfXlateModal" hidden>
      <div class="pdf-xlate-backdrop" id="pdfXlateBackdrop"></div>
      <div class="pdf-xlate-dialog" role="dialog" aria-modal="true" aria-labelledby="pdfXlateTitle">
        <header class="pdf-xlate-head">
          <h2 id="pdfXlateTitle">Translate PDF</h2>
          <button type="button" class="eva-icon-btn" id="pdfXlateClose" aria-label="Close">✕</button>
        </header>
        <p class="meta-line" id="pdfXlateStatus">Idle</p>
        <div class="pdf-xlate-actions" id="pdfXlateActions" hidden></div>
        <div class="pdf-xlate-body" id="pdfXlateBody"></div>
      </div>
    </div>
  </div>

  <div class="eva-widget" id="evaWidget">
    <div class="eva-panel" id="evaPanel" hidden>
      <header class="eva-panel-head">
        <div class="eva-panel-id">
          <span class="eva-mini-avatar" aria-hidden="true">👩‍⚖️</span>
          <div>
            <strong>Eva</strong>
            <span class="muted" id="evaMeta">Legal research assistant</span>
          </div>
        </div>
        <button type="button" class="eva-icon-btn" id="evaClose" aria-label="Close chat">✕</button>
      </header>
      <div class="eva-chat" id="evaChat" aria-live="polite"></div>
      <form class="eva-compose" id="evaForm">
        <label class="sr-only" for="evaInput">Message Eva</label>
        <input type="text" id="evaInput" autocomplete="off" enterkeyhint="send" placeholder="Type your question…" />
        <button type="submit" class="btn primary" id="evaSend">Send</button>
      </form>
    </div>
    <button type="button" class="eva-fab" id="evaFab" aria-label="Open Eva chat" aria-expanded="false" aria-controls="evaPanel">
      <span class="eva-fab-avatar" aria-hidden="true">👩‍⚖️</span>
      <span class="eva-fab-label">Eva</span>
    </button>
  </div>

  <script src="assets/app.js?v=home26" defer></script>
</body>
</html>
