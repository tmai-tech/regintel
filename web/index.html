<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RegIntel — Bill & Amendment PDFs</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <div class="logo">📄</div>
        <div>
          <h1>RegIntel PDFs</h1>
          <p class="subtitle">Bills &amp; amendments extracted from gazette / parliament links</p>
        </div>
      </div>
      <div class="meta-bar" id="metaBar">Loading…</div>
    </header>
    <section class="panel">
      <div class="toolbar">
        <input type="search" id="search" placeholder="Search title, jurisdiction, source link…" />
        <select id="filterJ"></select>
        <span id="rowCount" class="muted"></span>
      </div>
      <div id="list" class="pdf-list"></div>
    </section>
  </div>
  <script src="assets/app.js"></script>
</body>
</html>
